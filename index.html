<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作物生育管理 - 高校農業科</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root {
  --primary: #2e7d32;
  --primary-light: #60ad5e;
  --primary-dark: #005005;
  --accent: #ff8f00;
  --bg: #f5f5f5;
  --card: #ffffff;
  --text: #212121;
  --text-secondary: #757575;
  --border: #e0e0e0;
  --danger: #c62828;
  --danger-light: #fbe9e7;
  --success: #2e7d32;
  --success-light: #e8f5e9;
  --info: #1565c0;
  --info-light: #e3f2fd;
  --shadow: 0 2px 8px rgba(0,0,0,0.1);
  --radius: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}
header {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white;
  padding: 12px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow);
}
header h1 {
  font-size: 1.2rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
header h1 span { font-size: 1.4rem; }
nav {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  white-space: nowrap;
  -webkit-overflow-scrolling: touch;
  position: sticky;
  top: 52px;
  z-index: 99;
}
nav::-webkit-scrollbar { height: 0; }
.nav-inner {
  display: flex;
  min-width: max-content;
}
.tab-btn {
  background: none;
  border: none;
  padding: 12px 16px;
  font-size: 0.85rem;
  color: var(--text-secondary);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
  white-space: nowrap;
  font-weight: 500;
}
.tab-btn:hover { color: var(--primary); background: var(--success-light); }
.tab-btn.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
  font-weight: 700;
}
main { padding: 16px; max-width: 1200px; margin: 0 auto; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  margin-bottom: 16px;
}
.card-title {
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 16px;
  color: var(--primary-dark);
  border-bottom: 2px solid var(--primary-light);
  padding-bottom: 8px;
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
}
.form-group input, .form-group select, .form-group textarea {
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 0.95rem;
  font-family: inherit;
  transition: border-color 0.2s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(46,125,50,0.15);
}
.form-group textarea { resize: vertical; min-height: 80px; }
.form-group.full { grid-column: 1 / -1; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-accent { background: var(--accent); color: white; }
.btn-accent:hover { background: #e65100; }
.btn-danger { background: var(--danger); color: white; }
.btn-danger:hover { background: #8e0000; }
.btn-outline {
  background: transparent;
  color: var(--primary);
  border: 2px solid var(--primary);
}
.btn-outline:hover { background: var(--success-light); }
.btn-sm { padding: 6px 12px; font-size: 0.8rem; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}
th, td {
  padding: 10px 12px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
th {
  background: var(--success-light);
  font-weight: 700;
  color: var(--primary-dark);
  position: sticky;
  top: 0;
}
tr:hover { background: #f9f9f9; }
.table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
.badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 600;
}
.badge-rice { background: #e8f5e9; color: #2e7d32; }
.badge-wheat { background: #fff3e0; color: #e65100; }
.badge-veg { background: #e3f2fd; color: #1565c0; }
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
  box-shadow: var(--shadow);
  border-left: 4px solid var(--primary);
}
.stat-card .num {
  font-size: 2rem;
  font-weight: 800;
  color: var(--primary);
}
.stat-card .label {
  font-size: 0.78rem;
  color: var(--text-secondary);
  margin-top: 4px;
}
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  justify-content: center;
  align-items: flex-start;
  padding: 20px;
  overflow-y: auto;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card);
  border-radius: 12px;
  width: 100%;
  max-width: 640px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  margin-top: 40px;
  margin-bottom: 40px;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}
.modal-header h3 { font-size: 1.1rem; color: var(--primary-dark); }
.modal-close {
  background: none;
  border: none;
  font-size: 1.5rem;
  cursor: pointer;
  color: var(--text-secondary);
  padding: 4px;
}
.modal-body { padding: 20px; }
.modal-footer {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-secondary);
}
.empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
.empty-state p { font-size: 0.95rem; }
.filter-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  align-items: center;
}
.filter-bar select, .filter-bar input {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 0.85rem;
  font-family: inherit;
}
.chart-container {
  position: relative;
  height: 300px;
  max-height: 400px;
}
.grain-fields { display: none; }
.grain-fields.show { display: contents; }
.print-section { margin-bottom: 24px; }
.record-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  margin-bottom: 12px;
  border-left: 4px solid var(--primary);
}
.record-card .date { font-weight: 700; color: var(--primary-dark); margin-bottom: 8px; }
.record-card .meta { font-size: 0.82rem; color: var(--text-secondary); }
.record-card .content { margin-top: 8px; font-size: 0.9rem; }
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--primary-dark);
  color: white;
  padding: 12px 24px;
  border-radius: 8px;
  font-size: 0.9rem;
  z-index: 300;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
.confirm-dialog {
  text-align: center;
  padding: 20px;
}
.confirm-dialog p { margin-bottom: 20px; font-size: 1rem; }
@media (max-width: 600px) {
  header h1 { font-size: 1rem; }
  .tab-btn { padding: 10px 12px; font-size: 0.78rem; }
  main { padding: 10px; }
  .card { padding: 14px; }
  .form-grid { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .btn { padding: 8px 14px; font-size: 0.82rem; }
  .modal { margin-top: 10px; }
  .chart-container { height: 250px; }
}
@media print {
  header, nav, .btn-group, .filter-bar, .no-print { display: none !important; }
  .tab-content { display: block !important; }
  .card { box-shadow: none; border: 1px solid #ccc; page-break-inside: avoid; }
  body { background: white; }
  main { max-width: 100%; padding: 0; }
}
</style>
</head>
<body>

<header>
  <h1><span>🌾</span> 作物生育管理システム</h1>
</header>

<nav>
  <div class="nav-inner">
    <button class="tab-btn active" data-tab="dashboard">ダッシュボード</button>
    <button class="tab-btn" data-tab="crops">作物管理</button>
    <button class="tab-btn" data-tab="growth">生育記録</button>
    <button class="tab-btn" data-tab="work">作業管理</button>
    <button class="tab-btn" data-tab="charts">グラフ</button>
    <button class="tab-btn" data-tab="students">生徒管理</button>
    <button class="tab-btn" data-tab="export">印刷・出力</button>
  </div>
</nav>

<main>
  <!-- ダッシュボード -->
  <div id="dashboard" class="tab-content active">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="card">
      <div class="card-title">最近の生育記録</div>
      <div id="recentRecords"></div>
    </div>
    <div class="card">
      <div class="card-title">今後の予定収穫</div>
      <div id="upcomingHarvest"></div>
    </div>
  </div>

  <!-- 作物管理 -->
  <div id="crops" class="tab-content">
    <div class="card">
      <div class="card-title">作物登録</div>
      <form id="cropForm">
        <div class="form-grid">
          <div class="form-group">
            <label>作物タイプ *</label>
            <select id="cropType" required>
              <option value="">選択してください</option>
              <option value="rice">水稲</option>
              <option value="wheat">麦</option>
              <option value="vegetable">野菜類</option>
            </select>
          </div>
          <div class="form-group">
            <label>作物名 *</label>
            <input type="text" id="cropName" placeholder="例: コシヒカリ、トマト" required>
          </div>
          <div class="form-group">
            <label>品種</label>
            <input type="text" id="cropVariety" placeholder="例: 早生品種">
          </div>
          <div class="form-group">
            <label>圃場番号 *</label>
            <input type="text" id="cropField" placeholder="例: A-1" required>
          </div>
          <div class="form-group">
            <label>担当生徒名 *</label>
            <input type="text" id="cropStudent" placeholder="例: 山田太郎" required>
          </div>
          <div class="form-group">
            <label>播種日</label>
            <input type="date" id="cropSowDate">
          </div>
          <div class="form-group">
            <label>定植日</label>
            <input type="date" id="cropPlantDate">
          </div>
          <div class="form-group">
            <label>予定収穫日</label>
            <input type="date" id="cropHarvestDate">
          </div>
          <div id="riceFields" class="grain-fields">
            <div class="form-group">
              <label>出穂日</label>
              <input type="date" id="cropHeadingDate">
            </div>
          </div>
          <div id="wheatFields" class="grain-fields">
            <div class="form-group">
              <label>穂揃い期</label>
              <input type="date" id="cropEarDate">
            </div>
          </div>
        </div>
        <input type="hidden" id="cropEditId">
        <div class="btn-group no-print">
          <button type="submit" class="btn btn-primary">登録</button>
          <button type="button" class="btn btn-outline" onclick="resetCropForm()">クリア</button>
        </div>
      </form>
    </div>
    <div class="card">
      <div class="card-title">登録作物一覧</div>
      <div class="filter-bar no-print">
        <select id="cropFilterType" onchange="renderCropList()">
          <option value="">全タイプ</option>
          <option value="rice">水稲</option>
          <option value="wheat">麦</option>
          <option value="vegetable">野菜類</option>
        </select>
        <input type="text" id="cropFilterText" placeholder="検索..." oninput="renderCropList()">
      </div>
      <div id="cropList"></div>
    </div>
  </div>

  <!-- 生育記録 -->
  <div id="growth" class="tab-content">
    <div class="card">
      <div class="card-title">生育記録の入力</div>
      <form id="growthForm">
        <div class="form-grid">
          <div class="form-group">
            <label>作物 *</label>
            <select id="growthCrop" required></select>
          </div>
          <div class="form-group">
            <label>日付 *</label>
            <input type="date" id="growthDate" required>
          </div>
          <div class="form-group">
            <label>生育ステージ</label>
            <select id="growthStage">
              <option value="">選択</option>
              <option value="播種">播種</option>
              <option value="発芽">発芽</option>
              <option value="育苗">育苗</option>
              <option value="定植">定植</option>
              <option value="活着">活着</option>
              <option value="生育初期">生育初期</option>
              <option value="生育中期">生育中期</option>
              <option value="生育後期">生育後期</option>
              <option value="開花">開花</option>
              <option value="結実">結実</option>
              <option value="成熟">成熟</option>
              <option value="収穫">収穫</option>
              <option value="分げつ期">分げつ期</option>
              <option value="幼穂形成期">幼穂形成期</option>
              <option value="出穂期">出穂期</option>
              <option value="登熟期">登熟期</option>
            </select>
          </div>
          <div class="form-group">
            <label>草丈 (cm)</label>
            <input type="number" id="growthHeight" step="0.1" min="0" placeholder="例: 25.5">
          </div>
          <div class="form-group">
            <label>茎数 (本)</label>
            <input type="number" id="growthStems" min="0" placeholder="例: 15">
          </div>
          <div id="growthRiceFields" class="grain-fields">
            <div class="form-group">
              <label>分げつ数</label>
              <input type="number" id="growthTillers" min="0" placeholder="例: 20">
            </div>
            <div class="form-group">
              <label>倒伏の有無</label>
              <select id="growthLodging">
                <option value="">選択</option>
                <option value="なし">なし</option>
                <option value="軽微">軽微</option>
                <option value="中程度">中程度</option>
                <option value="甚大">甚大</option>
              </select>
            </div>
          </div>
          <div id="growthWheatFields" class="grain-fields">
            <div class="form-group">
              <label>赤かび病チェック</label>
              <select id="growthFusarium">
                <option value="">選択</option>
                <option value="発生なし">発生なし</option>
                <option value="要注意">要注意</option>
                <option value="発生あり">発生あり</option>
                <option value="多発">多発</option>
              </select>
            </div>
          </div>
          <div class="form-group full">
            <label>作業内容</label>
            <select id="growthWork">
              <option value="">選択</option>
              <option value="施肥">施肥</option>
              <option value="農薬散布">農薬散布</option>
              <option value="灌水">灌水</option>
              <option value="除草">除草</option>
              <option value="誘引">誘引</option>
              <option value="摘芯">摘芯</option>
              <option value="摘果">摘果</option>
              <option value="収穫">収穫</option>
              <option value="土寄せ">土寄せ</option>
              <option value="中耕">中耕</option>
              <option value="その他">その他</option>
            </select>
          </div>
          <div class="form-group full">
            <label>メモ・気づき</label>
            <textarea id="growthMemo" placeholder="観察した内容、気づいたことを記入"></textarea>
          </div>
        </div>
        <input type="hidden" id="growthEditId">
        <div class="btn-group no-print">
          <button type="submit" class="btn btn-primary">記録する</button>
          <button type="button" class="btn btn-outline" onclick="resetGrowthForm()">クリア</button>
        </div>
      </form>
    </div>
    <div class="card">
      <div class="card-title">生育記録一覧</div>
      <div class="filter-bar no-print">
        <select id="growthFilterCrop" onchange="renderGrowthList()">
          <option value="">全作物</option>
        </select>
        <input type="date" id="growthFilterFrom" onchange="renderGrowthList()" title="開始日">
        <input type="date" id="growthFilterTo" onchange="renderGrowthList()" title="終了日">
      </div>
      <div id="growthList"></div>
    </div>
  </div>

  <!-- 作業管理 -->
  <div id="work" class="tab-content">
    <div class="card">
      <div class="card-title">施肥記録</div>
      <form id="fertForm">
        <div class="form-grid">
          <div class="form-group">
            <label>作物 *</label>
            <select id="fertCrop" required></select>
          </div>
          <div class="form-group">
            <label>施用日 *</label>
            <input type="date" id="fertDate" required>
          </div>
          <div class="form-group">
            <label>肥料名 *</label>
            <input type="text" id="fertName" placeholder="例: 化成肥料 8-8-8" required>
          </div>
          <div class="form-group">
            <label>施用量 *</label>
            <input type="text" id="fertAmount" placeholder="例: 10kg/10a" required>
          </div>
        </div>
        <input type="hidden" id="fertEditId">
        <div class="btn-group no-print">
          <button type="submit" class="btn btn-primary">登録</button>
          <button type="button" class="btn btn-outline" onclick="resetFertForm()">クリア</button>
        </div>
      </form>
    </div>
    <div class="card">
      <div class="card-title">施肥履歴</div>
      <div class="filter-bar no-print">
        <select id="fertFilterCrop" onchange="renderFertList()">
          <option value="">全作物</option>
        </select>
      </div>
      <div id="fertList"></div>
    </div>

    <div class="card">
      <div class="card-title">農薬散布記録</div>
      <form id="pestForm">
        <div class="form-grid">
          <div class="form-group">
            <label>作物 *</label>
            <select id="pestCrop" required></select>
          </div>
          <div class="form-group">
            <label>散布日 *</label>
            <input type="date" id="pestDate" required>
          </div>
          <div class="form-group">
            <label>農薬名 *</label>
            <input type="text" id="pestName" placeholder="例: ダコニール1000" required>
          </div>
          <div class="form-group">
            <label>希釈倍数</label>
            <input type="text" id="pestDilution" placeholder="例: 1000倍">
          </div>
        </div>
        <input type="hidden" id="pestEditId">
        <div class="btn-group no-print">
          <button type="submit" class="btn btn-primary">登録</button>
          <button type="button" class="btn btn-outline" onclick="resetPestForm()">クリア</button>
        </div>
      </form>
    </div>
    <div class="card">
      <div class="card-title">農薬散布履歴</div>
      <div class="filter-bar no-print">
        <select id="pestFilterCrop" onchange="renderPestList()">
          <option value="">全作物</option>
        </select>
      </div>
      <div id="pestList"></div>
    </div>
  </div>

  <!-- グラフ -->
  <div id="charts" class="tab-content">
    <div class="card">
      <div class="card-title">生育データグラフ</div>
      <div class="filter-bar no-print">
        <select id="chartCrop" onchange="updateChart()">
          <option value="">作物を選択</option>
        </select>
        <select id="chartType" onchange="updateChart()">
          <option value="height">草丈の推移</option>
          <option value="stems">茎数の推移</option>
          <option value="tillers">分げつ数の推移</option>
        </select>
      </div>
      <div class="chart-container">
        <canvas id="growthChart"></canvas>
      </div>
    </div>
    <div class="card">
      <div class="card-title">作物タイプ別の登録数</div>
      <div class="chart-container" style="max-height:300px;">
        <canvas id="typeChart"></canvas>
      </div>
    </div>

<div id="toast" class="toast"></div>

<div id="confirmModal" class="modal-overlay">
  <div class="modal" style="max-width:400px;">
    <div class="modal-body confirm-dialog">
      <p id="confirmMsg"></p>
      <div class="btn-group" style="justify-content:center;">
        <button class="btn btn-danger" id="confirmYes">削除する</button>
        <button class="btn btn-outline" onclick="closeConfirm()">キャンセル</button>
      </div>
    </div>
  </div>
</div>

<script>
// ===== Data Layer =====
const KEYS = { crops: 'seiiku_crops', growth: 'seiiku_growth', fert: 'seiiku_fert', pest: 'seiiku_pest' };

function loadData(key) {
  try { return JSON.parse(localStorage.getItem(key)) || []; }
  catch { return []; }
}
function saveData(key, data) { localStorage.setItem(key, JSON.stringify(data)); }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function getCrops() { return loadData(KEYS.crops); }
function saveCrops(d) { saveData(KEYS.crops, d); }
function getGrowth() { return loadData(KEYS.growth); }
function saveGrowth(d) { saveData(KEYS.growth, d); }
function getFert() { return loadData(KEYS.fert); }
function saveFert(d) { saveData(KEYS.fert, d); }
function getPest() { return loadData(KEYS.pest); }
function savePest(d) { saveData(KEYS.pest, d); }

// ===== Utility =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function formatDate(d) {
  if (!d) return '-';
  const parts = d.split('-');
  if (parts.length === 3) return `${parts[0]}/${parts[1]}/${parts[2]}`;
  return d;
}

function typeName(t) {
  return { rice: '水稲', wheat: '麦', vegetable: '野菜類' }[t] || t;
}

function typeBadge(t) {
  const cls = { rice: 'badge-rice', wheat: 'badge-wheat', vegetable: 'badge-veg' }[t] || '';
  return `<span class="badge ${cls}">${typeName(t)}</span>`;
}

function cropLabel(crop) {
  return `${crop.name}（${crop.variety || '-'}）[${crop.fieldNo}] - ${crop.studentName}`;
}

let confirmCallback = null;
function showConfirm(msg, cb) {
  document.getElementById('confirmMsg').textContent = msg;
  document.getElementById('confirmModal').classList.add('show');
  confirmCallback = cb;
  document.getElementById('confirmYes').onclick = () => { closeConfirm(); if (confirmCallback) confirmCallback(); };
}
function closeConfirm() {
  document.getElementById('confirmModal').classList.remove('show');
  confirmCallback = null;
}

// ===== Tab Navigation =====
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'dashboard') renderDashboard();
    if (btn.dataset.tab === 'charts') { updateChart(); updateTypeChart(); }
    if (btn.dataset.tab === 'students') renderStudentView();
  });
});

// ===== Crop Type Toggle =====
document.getElementById('cropType').addEventListener('change', function() {
  document.getElementById('riceFields').classList.toggle('show', this.value === 'rice');
  document.getElementById('wheatFields').classList.toggle('show', this.value === 'wheat');
});

document.getElementById('growthCrop').addEventListener('change', function() {
  const crops = getCrops();
  const crop = crops.find(c => c.id === this.value);
  const isRice = crop && crop.type === 'rice';
  const isWheat = crop && crop.type === 'wheat';
  document.getElementById('growthRiceFields').classList.toggle('show', isRice);
  document.getElementById('growthWheatFields').classList.toggle('show', isWheat);
});

// ===== Populate Selects =====
function populateCropSelects() {
  const crops = getCrops();
  const selects = ['growthCrop', 'fertCrop', 'pestCrop', 'growthFilterCrop', 'fertFilterCrop', 'pestFilterCrop', 'chartCrop', 'studentFilter', 'exportTarget'];
  selects.forEach(id => {
    const sel = document.getElementById(id);
    if (!sel) return;
    const val = sel.value;
    const isFilter = id.includes('Filter') || id === 'chartCrop' || id === 'studentFilter' || id === 'exportTarget';
    const firstOpt = sel.querySelector('option');
    sel.innerHTML = '';
    if (isFilter && firstOpt) sel.appendChild(firstOpt);
    crops.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = cropLabel(c);
      sel.appendChild(opt);
    });
    if (val) sel.value = val;
  });
  // student filter
  const sf = document.getElementById('studentFilter');
  if (sf) {
    const students = [...new Set(crops.map(c => c.studentName))].sort();
    sf.innerHTML = '<option value="">全生徒</option>';
    students.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      sf.appendChild(opt);
    });
  }
}

// ===== Crop Form =====
document.getElementById('cropForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const crops = getCrops();
  const editId = document.getElementById('cropEditId').value;
  const data = {
    id: editId || genId(),
    type: document.getElementById('cropType').value,
    name: document.getElementById('cropName').value.trim(),
    variety: document.getElementById('cropVariety').value.trim(),
    fieldNo: document.getElementById('cropField').value.trim(),
    studentName: document.getElementById('cropStudent').value.trim(),
    sowDate: document.getElementById('cropSowDate').value,
    plantDate: document.getElementById('cropPlantDate').value,
    harvestDate: document.getElementById('cropHarvestDate').value,
    headingDate: document.getElementById('cropHeadingDate').value,
    earDate: document.getElementById('cropEarDate').value,
  };
  if (editId) {
    const idx = crops.findIndex(c => c.id === editId);
    if (idx >= 0) crops[idx] = data;
  } else {
    crops.push(data);
  }
  saveCrops(crops);
  resetCropForm();
  renderCropList();
  populateCropSelects();
  showToast(editId ? '作物情報を更新しました' : '作物を登録しました');
});

function resetCropForm() {
  document.getElementById('cropForm').reset();
  document.getElementById('cropEditId').value = '';
  document.getElementById('riceFields').classList.remove('show');
  document.getElementById('wheatFields').classList.remove('show');
}

function editCrop(id) {
  const crop = getCrops().find(c => c.id === id);
  if (!crop) return;
  document.getElementById('cropEditId').value = crop.id;
  document.getElementById('cropType').value = crop.type;
  document.getElementById('cropType').dispatchEvent(new Event('change'));
  document.getElementById('cropName').value = crop.name;
  document.getElementById('cropVariety').value = crop.variety || '';
  document.getElementById('cropField').value = crop.fieldNo;
  document.getElementById('cropStudent').value = crop.studentName;
  document.getElementById('cropSowDate').value = crop.sowDate || '';
  document.getElementById('cropPlantDate').value = crop.plantDate || '';
  document.getElementById('cropHarvestDate').value = crop.harvestDate || '';
  document.getElementById('cropHeadingDate').value = crop.headingDate || '';
  document.getElementById('cropEarDate').value = crop.earDate || '';
  document.querySelector('[data-tab="crops"]').click();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function deleteCrop(id) {
  showConfirm('この作物と関連する全記録を削除しますか？', () => {
    let crops = getCrops().filter(c => c.id !== id);
    saveCrops(crops);
    let growth = getGrowth().filter(g => g.cropId !== id);
    saveGrowth(growth);
    let fert = getFert().filter(f => f.cropId !== id);
    saveFert(fert);
    let pest = getPest().filter(p => p.cropId !== id);
    savePest(pest);
    renderCropList();
    populateCropSelects();
    showToast('作物を削除しました');
  });
}

function renderCropList() {
  const crops = getCrops();
  const filterType = document.getElementById('cropFilterType').value;
  const filterText = document.getElementById('cropFilterText').value.toLowerCase();
  const filtered = crops.filter(c => {
    if (filterType && c.type !== filterType) return false;
    if (filterText) {
      const searchStr = `${c.name} ${c.variety} ${c.fieldNo} ${c.studentName}`.toLowerCase();
      if (!searchStr.includes(filterText)) return false;
    }
    return true;
  });
  const el = document.getElementById('cropList');
  if (filtered.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="icon">🌱</div><p>登録された作物がありません</p></div>';
    return;
  }
  let html = '<div class="table-wrap"><table><thead><tr><th>タイプ</th><th>作物名</th><th>品種</th><th>圃場</th><th>担当</th><th>播種日</th><th>予定収穫日</th><th class="no-print">操作</th></tr></thead><tbody>';
  filtered.forEach(c => {
    html += `<tr>
      <td>${typeBadge(c.type)}</td>
      <td>${esc(c.name)}</td>
      <td>${esc(c.variety || '-')}</td>
      <td>${esc(c.fieldNo)}</td>
      <td>${esc(c.studentName)}</td>
      <td>${formatDate(c.sowDate)}</td>
      <td>${formatDate(c.harvestDate)}</td>
      <td class="no-print">
        <button class="btn btn-outline btn-sm" onclick="editCrop('${c.id}')">編集</button>
        <button class="btn btn-danger btn-sm" onclick="deleteCrop('${c.id}')">削除</button>
      </td>
    </tr>`;
  });
  html += '</tbody></table></div>';
  el.innerHTML = html;
}

// ===== Growth Form =====
document.getElementById('growthForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const records = getGrowth();
  const editId = document.getElementById('growthEditId').value;
  const data = {
    id: editId || genId(),
    cropId: document.getElementById('growthCrop').value,
    date: document.getElementById('growthDate').value,
    stage: document.getElementById('growthStage').value,
    height: parseFloat(document.getElementById('growthHeight').value) || null,
    stems: parseInt(document.getElementById('growthStems').value) || null,
    tillers: parseInt(document.getElementById('growthTillers').value) || null,
    lodging: document.getElementById('growthLodging').value,
    fusarium: document.getElementById('growthFusarium').value,
    work: document.getElementById('growthWork').value,
    memo: document.getElementById('growthMemo').value.trim(),
  };
  if (editId) {
    const idx = records.findIndex(r => r.id === editId);
    if (idx >= 0) records[idx] = data;
  } else {
    records.push(data);
  }
  saveGrowth(records);
  resetGrowthForm();
  renderGrowthList();
  showToast(editId ? '記録を更新しました' : '生育記録を保存しました');
});

function resetGrowthForm() {
  document.getElementById('growthForm').reset();
  document.getElementById('growthEditId').value = '';
  document.getElementById('growthRiceFields').classList.remove('show');
  document.getElementById('growthWheatFields').classList.remove('show');
}

function editGrowth(id) {
  const rec = getGrowth().find(r => r.id === id);
  if (!rec) return;
  document.getElementById('growthEditId').value = rec.id;
  document.getElementById('growthCrop').value = rec.cropId;
  document.getElementById('growthCrop').dispatchEvent(new Event('change'));
  document.getElementById('growthDate').value = rec.date;
  document.getElementById('growthStage').value = rec.stage || '';
  document.getElementById('growthHeight').value = rec.height || '';
  document.getElementById('growthStems').value = rec.stems || '';
  document.getElementById('growthTillers').value = rec.tillers || '';
  document.getElementById('growthLodging').value = rec.lodging || '';
  document.getElementById('growthFusarium').value = rec.fusarium || '';
  document.getElementById('growthWork').value = rec.work || '';
  document.getElementById('growthMemo').value = rec.memo || '';
  document.querySelector('[data-tab="growth"]').click();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function deleteGrowth(id) {
  showConfirm('この記録を削除しますか？', () => {
    saveGrowth(getGrowth().filter(r => r.id !== id));
    renderGrowthList();
    showToast('記録を削除しました');
  });
}

function renderGrowthList() {
  const records = getGrowth();
  const crops = getCrops();
  const filterCrop = document.getElementById('growthFilterCrop').value;
  const filterFrom = document.getElementById('growthFilterFrom').value;
  const filterTo = document.getElementById('growthFilterTo').value;
  const filtered = records.filter(r => {
    if (filterCrop && r.cropId !== filterCrop) return false;
    if (filterFrom && r.date < filterFrom) return false;
    if (filterTo && r.date > filterTo) return false;
    return true;
  }).sort((a, b) => b.date.localeCompare(a.date));

  const el = document.getElementById('growthList');
  if (filtered.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>生育記録がありません</p></div>';
    return;
  }

  let html = '';
  filtered.forEach(r => {
    const crop = crops.find(c => c.id === r.cropId);
    const cName = crop ? `${crop.name}（${crop.fieldNo}）` : '不明';
    let details = [];
    if (r.stage) details.push(`ステージ: ${r.stage}`);
    if (r.height) details.push(`草丈: ${r.height}cm`);
    if (r.stems) details.push(`茎数: ${r.stems}本`);
    if (r.tillers) details.push(`分げつ数: ${r.tillers}`);
    if (r.lodging) details.push(`倒伏: ${r.lodging}`);
    if (r.fusarium) details.push(`赤かび病: ${r.fusarium}`);
    if (r.work) details.push(`作業: ${r.work}`);

    html += `<div class="record-card">
      <div class="date">${formatDate(r.date)} - ${esc(cName)}</div>
      <div class="meta">${details.map(d => esc(d)).join(' ／ ')}</div>
      ${r.memo ? `<div class="content">${esc(r.memo)}</div>` : ''}
      <div class="btn-group no-print">
        <button class="btn btn-outline btn-sm" onclick="editGrowth('${r.id}')">編集</button>
        <button class="btn btn-danger btn-sm" onclick="deleteGrowth('${r.id}')">削除</button>
      </div>
    </div>`;
  });
  el.innerHTML = html;
}

// ===== Fertilizer Form =====
document.getElementById('fertForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const records = getFert();
  const editId = document.getElementById('fertEditId').value;
  const data = {
    id: editId || genId(),

function resetFertForm() {

  document.getElementById('fertEditId').value = '';
}

function editFert(id) {

  if (!rec) return;
  document.getElementById('fertEditId').value = rec.id;
  document.getElementById('fertCrop').value = rec.cropId;
  document.getElementById('fertDate').value = rec.date;

  document.getElementById('fertAmount').value = rec.amount;
  document.querySelector('[data-tab="work"]').click();

function deleteFert(id) {

    saveFert(getFert().filter(r => r.id !== id));
    renderFertList();
    showToast('施肥記録を削除しました');
  });
}

function renderFertList() {
  const records = getFert();
  const crops = getCrops();
  const filterCrop = document.getElementById('fertFilterCrop').value;
  const filtered = records.filter(r => !filterCrop || r.cropId === filterCrop)
    .sort((a, b) => b.date.localeCompare(a.date));

  const el = document.getElementById('fertList');

  let html = '<div class="table-wrap"><table><thead><tr><th>施用日</th><th>作物</th><th>肥料名</th><th>施用量</th><th class="no-print">操作</th></tr></thead><tbody>';
  filtered.forEach(r => {
    const crop = crops.find(c => c.id === r.cropId);
    html += `<tr>
      <td>${formatDate(r.date)}</td>
      <td>${crop ? esc(crop.name) + '（' + esc(crop.fieldNo) + '）' : '不明'}</td>
      <td>${esc(r.name)}</td>
      <td>${esc(r.amount)}</td>
      <td class="no-print">
        <button class="btn btn-outline btn-sm" onclick="editFert('${r.id}')">編集</button>
        <button class="btn btn-danger btn-sm" onclick="deleteFert('${r.id}')">削除</button>
      </td>
    </tr>`;
  });

}

function renderPestList() {

// ===== Dashboard =====
function renderDashboard() {
  const crops = getCrops();
  const growth = getGrowth();
  const fert = getFert();
  const pest = getPest();
  const students = [...new Set(crops.map(c => c.studentName))];

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="num">${crops.length}</div><div class="label">登録作物数</div></div>
    <div class="stat-card"><div class="num">${growth.length}</div><div class="label">生育記録数</div></div>
    <div class="stat-card"><div class="num">${fert.length + pest.length}</div><div class="label">作業記録数</div></div>
    <div class="stat-card"><div class="num">${students.length}</div><div class="label">担当生徒数</div></div>
  `;

  // Recent records
  const recent = growth.sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5);
  const recentEl = document.getElementById('recentRecords');
  if (recent.length === 0) {
    recentEl.innerHTML = '<div class="empty-state"><p>まだ記録がありません</p></div>';
  } else {
    let html = '';
    recent.forEach(r => {
      const crop = crops.find(c => c.id === r.cropId);
      const cName = crop ? `${crop.name}（${crop.fieldNo}）` : '不明';
      let info = [];
      if (r.stage) info.push(r.stage);
      if (r.height) info.push(`草丈${r.height}cm`);
      if (r.work) info.push(r.work);
      html += `<div class="record-card" style="border-left-color:${crop ? ({ rice: '#2e7d32', wheat: '#e65100', vegetable: '#1565c0' }[crop.type] || 'var(--primary)') : 'var(--primary)'}">
        <div class="date">${formatDate(r.date)} - ${esc(cName)}</div>
        <div class="meta">${info.map(i => esc(i)).join(' ／ ')}</div>
        ${r.memo ? `<div class="content">${esc(r.memo)}</div>` : ''}
      </div>`;
    });
    recentEl.innerHTML = html;
  }

  // Upcoming harvest
  const today = new Date().toISOString().split('T')[0];
  const upcoming = crops.filter(c => c.harvestDate && c.harvestDate >= today)
    .sort((a, b) => a.harvestDate.localeCompare(b.harvestDate)).slice(0, 5);
  const harvestEl = document.getElementById('upcomingHarvest');
  if (upcoming.length === 0) {
    harvestEl.innerHTML = '<div class="empty-state"><p>予定されている収穫はありません</p></div>';
  } else {
    let html = '<div class="table-wrap"><table><thead><tr><th>予定収穫日</th><th>作物</th><th>圃場</th><th>担当</th></tr></thead><tbody>';
    upcoming.forEach(c => {
      const daysLeft = Math.ceil((new Date(c.harvestDate) - new Date(today)) / 86400000);
      html += `<tr>
        <td>${formatDate(c.harvestDate)} <span style="color:${daysLeft <= 7 ? 'var(--danger)' : 'var(--text-secondary)'};font-size:0.8rem;">(あと${daysLeft}日)</span></td>
        <td>${typeBadge(c.type)} ${esc(c.name)}</td>
        <td>${esc(c.fieldNo)}</td>
        <td>${esc(c.studentName)}</td>
      </tr>`;
    });
    html += '</tbody></table></div>';
    harvestEl.innerHTML = html;
  }
}

// ===== Charts =====
let growthChartInstance = null;
let typeChartInstance = null;

function updateChart() {
  const cropId = document.getElementById('chartCrop').value;
  const chartType = document.getElementById('chartType').value;
  const canvas = document.getElementById('growthChart');
  const ctx = canvas.getContext('2d');

  if (growthChartInstance) { growthChartInstance.destroy(); growthChartInstance = null; }

  if (!cropId) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    return;
  }

  const records = getGrowth().filter(r => r.cropId === cropId).sort((a, b) => a.date.localeCompare(b.date));
  const crop = getCrops().find(c => c.id === cropId);
  const labels = records.map(r => formatDate(r.date));

  let dataKey, label, color;
  switch (chartType) {
    case 'height': dataKey = 'height'; label = '草丈 (cm)'; color = '#2e7d32'; break;
    case 'stems': dataKey = 'stems'; label = '茎数 (本)'; color = '#1565c0'; break;
    case 'tillers': dataKey = 'tillers'; label = '分げつ数'; color = '#e65100'; break;
  }

  const data = records.map(r => r[dataKey]);
  if (data.every(v => v === null || v === undefined)) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.font = '14px sans-serif';
    ctx.fillStyle = '#757575';
    ctx.textAlign = 'center';
    ctx.fillText('データがありません', canvas.width / 2, canvas.height / 2);
    return;
  }

  growthChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: `${crop ? crop.name : ''} - ${label}`,
        data,
        borderColor: color,
        backgroundColor: color + '20',
        fill: true,
        tension: 0.3,
        pointRadius: 5,
        pointHoverRadius: 7,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: 'top' } },
      scales: {
        y: { beginAtZero: true, title: { display: true, text: label } },
        x: { title: { display: true, text: '日付' } }
      }
    }
  });
}

function updateTypeChart() {
  const canvas = document.getElementById('typeChart');
  const ctx = canvas.getContext('2d');
  if (typeChartInstance) { typeChartInstance.destroy(); typeChartInstance = null; }

  const crops = getCrops();
  const counts = { rice: 0, wheat: 0, vegetable: 0 };
  crops.forEach(c => { if (counts[c.type] !== undefined) counts[c.type]++; });

  typeChartInstance = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['水稲', '麦', '野菜類'],
      datasets: [{
        data: [counts.rice, counts.wheat, counts.vegetable],
        backgroundColor: ['#2e7d32', '#e65100', '#1565c0'],
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom' } }
    }
  });
}

// ===== Student View =====
function renderStudentView() {
  const crops = getCrops();
  const growth = getGrowth();
  const filter = document.getElementById('studentFilter').value;
  const students = filter ? [filter] : [...new Set(crops.map(c => c.studentName))].sort();

  const el = document.getElementById('studentView');
  if (students.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="icon">👩‍🌾</div><p>生徒データがありません</p></div>';
    return;
  }

  let html = '';
  students.forEach(s => {
    const sCrops = crops.filter(c => c.studentName === s);
    const sRecords = growth.filter(r => sCrops.some(c => c.id === r.cropId));
    html += `<div class="card">
      <div class="card-title">${esc(s)}（担当作物: ${sCrops.length}件 ／ 記録数: ${sRecords.length}件）</div>`;
    if (sCrops.length === 0) {
      html += '<p style="color:var(--text-secondary);">担当作物なし</p>';
    } else {
      html += '<div class="table-wrap"><table><thead><tr><th>タイプ</th><th>作物名</th><th>圃場</th><th>記録数</th><th>最終記録日</th></tr></thead><tbody>';
      sCrops.forEach(c => {
        const cRecords = sRecords.filter(r => r.cropId === c.id);
        const lastDate = cRecords.sort((a, b) => b.date.localeCompare(a.date))[0];
        html += `<tr>
          <td>${typeBadge(c.type)}</td>
          <td>${esc(c.name)}</td>
          <td>${esc(c.fieldNo)}</td>
          <td>${cRecords.length}</td>
          <td>${lastDate ? formatDate(lastDate.date) : '-'}</td>
        </tr>`;
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';
  });
  el.innerHTML = html;
}

// ===== Print / Export =====
function generatePrintView() {
  const targetId = document.getElementById('exportTarget').value;
  const content = document.getElementById('exportContent').value;
  const crops = getCrops();
  const targetCrops = targetId === 'all' ? crops : crops.filter(c => c.id === targetId);

  if (targetCrops.length === 0) {
    document.getElementById('printPreview').innerHTML = '<div class="empty-state"><p>出力対象がありません</p></div>';
    return;
  }

  let html = '';
  targetCrops.forEach(crop => {
    html += `<div class="card print-section">
      <div class="card-title">${esc(crop.name)}（${esc(crop.variety || '-')}）- 圃場: ${esc(crop.fieldNo)} - 担当: ${esc(crop.studentName)}</div>`;

    if (content === 'summary' || content === 'full') {
      html += `<table style="margin-bottom:16px;">
        <tr><th style="width:120px;">タイプ</th><td>${typeName(crop.type)}</td><th style="width:120px;">圃場</th><td>${esc(crop.fieldNo)}</td></tr>
        <tr><th>播種日</th><td>${formatDate(crop.sowDate)}</td><th>定植日</th><td>${formatDate(crop.plantDate)}</td></tr>
        <tr><th>予定収穫日</th><td>${formatDate(crop.harvestDate)}</td>`;
      if (crop.type === 'rice') html += `<th>出穂日</th><td>${formatDate(crop.headingDate)}</td>`;
      else if (crop.type === 'wheat') html += `<th>穂揃い期</th><td>${formatDate(crop.earDate)}</td>`;
      else html += '<th></th><td></td>';
      html += '</tr></table>';
    }

    if (content === 'summary' || content === 'growth' || content === 'full') {
      const records = getGrowth().filter(r => r.cropId === crop.id).sort((a, b) => a.date.localeCompare(b.date));
      if (records.length > 0) {
        html += '<h4 style="margin:12px 0 8px;">生育記録</h4>';
        html += '<table><thead><tr><th>日付</th><th>ステージ</th><th>草丈</th><th>茎数</th>';
        if (crop.type === 'rice') html += '<th>分げつ数</th><th>倒伏</th>';
        if (crop.type === 'wheat') html += '<th>赤かび病</th>';
        html += '<th>作業</th><th>メモ</th></tr></thead><tbody>';
        records.forEach(r => {
          html += `<tr><td>${formatDate(r.date)}</td><td>${esc(r.stage || '-')}</td>
            <td>${r.height ? r.height + 'cm' : '-'}</td><td>${r.stems || '-'}</td>`;
          if (crop.type === 'rice') html += `<td>${r.tillers || '-'}</td><td>${esc(r.lodging || '-')}</td>`;
          if (crop.type === 'wheat') html += `<td>${esc(r.fusarium || '-')}</td>`;
          html += `<td>${esc(r.work || '-')}</td><td>${esc(r.memo || '-')}</td></tr>`;
        });
        html += '</tbody></table>';
      }
    }

    if (content === 'fert' || content === 'full') {
      const ferts = getFert().filter(f => f.cropId === crop.id).sort((a, b) => a.date.localeCompare(b.date));
      if (ferts.length > 0) {
        html += '<h4 style="margin:12px 0 8px;">施肥履歴</h4>';
        html += '<table><thead><tr><th>施用日</th><th>肥料名</th><th>施用量</th></tr></thead><tbody>';
        ferts.forEach(f => {
          html += `<tr><td>${formatDate(f.date)}</td><td>${esc(f.name)}</td><td>${esc(f.amount)}</td></tr>`;
        });
        html += '</tbody></table>';
      }
    }

    if (content === 'pest' || content === 'full') {
      const pests = getPest().filter(p => p.cropId === crop.id).sort((a, b) => a.date.localeCompare(b.date));
      if (pests.length > 0) {
        html += '<h4 style="margin:12px 0 8px;">農薬散布履歴</h4>';
        html += '<table><thead><tr><th>散布日</th><th>農薬名</th><th>希釈倍数</th></tr></thead><tbody>';
        pests.forEach(p => {
          html += `<tr><td>${formatDate(p.date)}</td><td>${esc(p.name)}</td><td>${esc(p.dilution || '-')}</td></tr>`;
        });
        html += '</tbody></table>';
      }
    }

    html += '</div>';
  });

  document.getElementById('printPreview').innerHTML = html;
  showToast('プレビューを生成しました');
}

function exportCSV() {
  const targetId = document.getElementById('exportTarget').value;
  const crops = getCrops();
  const targetCrops = targetId === 'all' ? crops : crops.filter(c => c.id === targetId);

  if (targetCrops.length === 0) {
    showToast('出力対象がありません');
    return;
  }

  const BOM = '\uFEFF';
  let csv = BOM + '作物名,品種,タイプ,圃場,担当,日付,ステージ,草丈(cm),茎数,分げつ数,倒伏,赤かび病,作業,メモ\n';

  targetCrops.forEach(crop => {
    const records = getGrowth().filter(r => r.cropId === crop.id).sort((a, b) => a.date.localeCompare(b.date));
    if (records.length === 0) {
      csv += `"${crop.name}","${crop.variety || ''}","${typeName(crop.type)}","${crop.fieldNo}","${crop.studentName}","","","","","","","","",""\n`;
    } else {
      records.forEach(r => {
        csv += `"${crop.name}","${crop.variety || ''}","${typeName(crop.type)}","${crop.fieldNo}","${crop.studentName}","${r.date}","${r.stage || ''}","${r.height || ''}","${r.stems || ''}","${r.tillers || ''}","${r.lodging || ''}","${r.fusarium || ''}","${r.work || ''}","${(r.memo || '').replace(/"/g, '""')}"\n`;
      });
    }
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `生育記録_${new Date().toISOString().split('T')[0]}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSVファイルをダウンロードしました');
}

// ===== XSS Prevention =====
function esc(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== Init =====
function init() {
  document.getElementById('growthDate').valueAsDate = new Date();
  document.getElementById('fertDate').valueAsDate = new Date();
  document.getElementById('pestDate').valueAsDate = new Date();
  populateCropSelects();
  renderDashboard();
  renderCropList();
  renderGrowthList();
  renderFertList();
  renderPestList();
}

init();
</script>
