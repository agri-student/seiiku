<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b5e20"/>
      <stop offset="100%" style="stop-color:#4caf50"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256,260)" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main stem -->
    <line x1="0" y1="120" x2="0" y2="-80" stroke-width="10"/>
    <!-- Left leaves -->
    <path d="M0,40 Q-65,-5 -90,-70" stroke-width="9"/>
    <path d="M0,-5 Q-55,-50 -75,-100" stroke-width="8"/>
    <path d="M0,-45 Q-40,-75 -50,-110" stroke-width="7"/>
    <!-- Right leaves -->
    <path d="M0,60 Q65,15 85,-50" stroke-width="9"/>
    <path d="M0,15 Q55,-25 70,-85" stroke-width="8"/>
    <path d="M0,-25 Q40,-60 55,-100" stroke-width="7"/>
    <!-- Top grain head -->
    <path d="M0,-80 Q15,-130 10,-160" stroke-width="7"/>
    <path d="M0,-80 Q-15,-125 -12,-158" stroke-width="7"/>
    <path d="M0,-80 Q0,-130 0,-165" stroke-width="7"/>
    <path d="M0,-80 Q25,-115 22,-145" stroke-width="6"/>
    <path d="M0,-80 Q-25,-112 -22,-143" stroke-width="6"/>
    <!-- Grain dots -->
    <circle cx="10" cy="-162" r="7" fill="#FFD54F" stroke="none"/>
    <circle cx="-12" cy="-160" r="7" fill="#FFD54F" stroke="none"/>
    <circle cx="0" cy="-167" r="6" fill="#FFD54F" stroke="none"/>
    <circle cx="22" cy="-147" r="6" fill="#FFD54F" stroke="none"/>
    <circle cx="-22" cy="-145" r="6" fill="#FFD54F" stroke="none"/>
    <circle cx="16" cy="-150" r="5" fill="#FFC107" stroke="none"/>
    <circle cx="-17" cy="-148" r="5" fill="#FFC107" stroke="none"/>
    <!-- Ground -->
    <ellipse cx="0" cy="125" rx="55" ry="8" fill="rgba(255,255,255,0.3)" stroke="none"/>
  </g>
</svg>
